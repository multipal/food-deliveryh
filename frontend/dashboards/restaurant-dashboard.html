<!doctype html><html><head><meta charset="utf-8"><title>Restaurant Dashboard</title><link rel="stylesheet" href="../dashboard.css"></head><body><header><b>Restaurant Dashboard</b></header><main><h2>Incoming Orders</h2><div id="orders"></div></main><script src="../dashboard.js"></script><script>
async function load(){let r=await api('/api/v1/orders/');let d=await r.json();orders.innerHTML=d.map(o=>`<article><b>Order #${o.id}</b><p>${o.status} · ₹${o.total}</p><button onclick="setStatus(${o.id},'ACCEPTED')">Accept</button><button onclick="setStatus(${o.id},'PREPARING')">Preparing</button><button onclick="setStatus(${o.id},'READY')">Ready</button></article>`).join('')} async function setStatus(id,s){await api('/api/v1/orders/'+id+'/status/',{method:'PATCH',body:JSON.stringify({status:s})});load()} load();
</script></body></html>
