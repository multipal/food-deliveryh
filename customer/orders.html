<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders</title><link rel="stylesheet" href="../css/style.css"><script src="../js/store.js"></script></head><body><header><a href="index.html">← Food</a><h1>My Orders</h1></header><div class="container" id="orders"></div><script>const a=JSON.parse(localStorage.getItem('lfd_orders_v12')||'[]');orders.innerHTML=a.length?a.map(o=>`<article class="card"><div class="row"><b>#${o.id}</b><span class="status">${o.status}</span></div><h3>${o.restaurant}</h3><p>₹${o.total} · ${o.payment}</p><p class="muted">${o.items.map(x=>x.item.name+' × '+x.qty).join(', ')}</p><p class="muted">${o.address}</p><button class="button" onclick="alert('Tracking status: ${o.status}')">Track</button></article>`).join(''):'<div class="card">No orders yet.<br><a class="button" href="index.html">Start ordering</a></div>';</script></body></html>
