<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Delivery Tracking</title><link rel="stylesheet" href="../css/style.css"><style>#map{height:420px;border-radius:12px;background:#eee;margin-top:12px}.muted{opacity:.75}</style></head><body><main class="container"><h1>Live Delivery Tracking</h1><section class="card"><p id="status">Loading…</p><p class="muted">Your rider's live location is shown only while this delivery is active. Exact service radius/distance is not shown.</p><div id="map"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script>
const API='../django_backend', token=localStorage.getItem('access_token')||localStorage.getItem('token'); const id=new URLSearchParams(location.search).get('order');
let map,marker; function initMap(){map=L.map('map').setView([20.5937,78.9629],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}
async function load(){if(!id){status.textContent='Order ID missing';return} const r=await fetch(`${API}/orders/${id}/tracking/`,{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){status.textContent=d.detail||'Unable to load tracking';return} status.textContent='Order #'+d.order_id+' — '+d.status; const x=d.delivery;if(x&&x.latitude!=null){const ll=[x.latitude,x.longitude]; if(!marker)marker=L.marker(ll).addTo(map).bindPopup('Delivery partner').openPopup();else marker.setLatLng(ll);map.setView(ll,15)}else if(x){status.textContent+=' — Rider location waiting for update.'}}
initMap();load();setInterval(load,10000);
</script></body></html>
