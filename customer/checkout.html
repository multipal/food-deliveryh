<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title><link rel="stylesheet" href="../css/style.css"><script src="../js/store.js"></script></head>
<body><header><a href="cart.html">← Cart</a><h1>Checkout</h1></header><div class="container"><div class="card"><h2>Delivery details</h2><label>Name</label><input id="name" required placeholder="Your name"><label>Phone</label><input id="phone" required inputmode="tel" placeholder="Mobile number"><label>Address</label><textarea id="address" required placeholder="House / street / area"></textarea><label>Payment</label><select id="payment"><option value="COD">Cash on Delivery</option><option value="ONLINE">Online Payment</option></select><div id="bill"></div><button class="button full" onclick="place()">Place order</button></div><div id="done"></div></div>
<script>function draw(){bill.innerHTML=`<h3>Bill</h3><div class="row"><span>Subtotal</span><b>₹${cartSubtotal()}</b></div><div class="row"><span>Delivery</span><b>₹${deliveryFee()}</b></div><div class="row"><span>Coupon</span><b>-₹${couponDiscount()}</b></div><hr><div class="row"><b>Total</b><b>₹${cartTotal()}</b></div>`}function place(){const c=getCart();if(!c.length)return alert('Cart is empty');if(!name.value.trim()||!phone.value.trim()||!address.value.trim())return alert('Please fill delivery details');const r=findRestaurant(c[0].restaurantId);let orders=JSON.parse(localStorage.getItem('lfd_orders_v12')||'[]');const o={id:'LFD'+Date.now().toString().slice(-7),restaurant:r.name,items:c,total:cartTotal(),subtotal:cartSubtotal(),deliveryFee:deliveryFee(),coupon:getCoupon(),discount:couponDiscount(),name:name.value.trim(),phone:phone.value.trim(),address:address.value.trim(),payment:payment.value,status:'PLACED',createdAt:new Date().toISOString()};orders.unshift(o);localStorage.setItem('lfd_orders_v12',JSON.stringify(orders));saveCart([]);setCoupon('');done.innerHTML=`<div class="success"><h2>Order placed 🎉</h2><p>Order <b>#${o.id}</b> has been placed with ${r.name}.</p><p>Status: <b>PLACED</b></p><a class="button" href="orders.html">Track order</a></div>`;window.scrollTo(0,0)}draw();</script></body></html>
