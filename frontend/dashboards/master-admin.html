<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Admin</title><link rel="stylesheet" href="../dashboard.css"></head><body>
<main class="dashboard"><header><h1>Master Admin</h1><p>Platform control center</p></header>
<section class="cards" id="stats"></section>
<section class="panel"><h2>Platform Settings</h2><div class="grid"><label>Service radius <input id="radius" type="number"></label><label>Delivery fee <input id="fee" type="number"></label><label>Minimum order <input id="minimum" type="number"></label><label>Commission % <input id="commission" type="number" step="0.01"></label></div><button onclick="saveSettings()">Save settings</button><span id="settingsMsg"></span></section>
<section class="panel"><h2>Website Branding & Ads</h2><div class="grid"><label>Website name <input id="siteNameInput"></label><label>Logo URL <input id="logoInput"></label><label>AdSense enabled <select id="adsenseEnabled"><option value="0">No</option><option value="1">Yes</option></select></label><label>AdSense client ID <input id="adsenseClient" placeholder="ca-pub-..."></label><label>AdSense slot ID <input id="adsenseSlot"></label></div><button onclick="saveBranding()">Save branding</button><hr><h3>My own ads</h3><div class="grid"><label>Title <input id="adTitle"></label><label>Image URL <input id="adImage"></label><label>Target URL <input id="adTarget"></label><label>Placement <select id="adPlacement"><option value="home">Customer Home</option><option value="search">Search</option><option value="restaurant">Restaurant/Menu</option><option value="checkout">Checkout</option></select></label></div><button onclick="createAd()">Add my ad</button><div id="adsList"></div></section>
<section class="panel"><h2>Restaurants</h2><div id="restaurants"></div></section>
<section class="panel"><h2>Delivery Partners</h2><div id="delivery"></div></section>
<section class="panel"><h2>Recent Orders</h2><div id="orders"></div></section>
<script>
const API='/api/v1/admin/';
async function api(path,opt={}){const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt}); if(!r.ok) throw new Error(await r.text()); return r.json();}
function cards(d){document.querySelector('#stats').innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><b>${v}</b><span>${k.replaceAll('_',' ')}</span></div>`).join('')}
async function load(){try{cards(await api('dashboard/'));const s=await api('settings/');radius.value=s.delivery_radius;fee.value=s.delivery_fee;minimum.value=s.minimum_order;commission.value=s.commission;const b=await api('branding/');siteNameInput.value=b.site_name||'';logoInput.value=b.site_logo_url||'';adsenseEnabled.value=b.adsense_enabled||'0';adsenseClient.value=b.adsense_client||'';adsenseSlot.value=b.adsense_slot||'';renderAds(await api('ads/'));renderRestaurants(await api('restaurants/'));renderDelivery(await api('delivery/'));renderOrders(await api('orders/'));}catch(e){document.body.insertAdjacentHTML('beforeend',`<p>Admin API error: ${e.message}</p>`)} }
async function saveBranding(){await api('branding/',{method:'PATCH',body:JSON.stringify({site_name:siteNameInput.value,site_logo_url:logoInput.value,adsense_enabled:adsenseEnabled.value,adsense_client:adsenseClient.value,adsense_slot:adsenseSlot.value})});settingsMsg.textContent=' Branding saved';}
async function createAd(){await api('ads/',{method:'POST',body:JSON.stringify({title:adTitle.value,image_url:adImage.value,target_url:adTarget.value,placement:adPlacement.value,active:true})});renderAds(await api('ads/'));}
function renderAds(a){adsList.innerHTML=a.map(x=>`<div class="row"><b>${x.title}</b><span>${x.placement}</span><span>${x.active?'ON':'OFF'}</span><button onclick="toggleAd(${x.id},${!x.active})">${x.active?'Disable':'Enable'}</button></div>`).join('')}
async function toggleAd(id,active){await api('ads/'+id+'/',{method:'PATCH',body:JSON.stringify({active})});renderAds(await api('ads/'));}
async function saveSettings(){await api('settings/',{method:'PATCH',body:JSON.stringify({delivery_radius:radius.value,delivery_fee:fee.value,minimum_order:minimum.value,commission:commission.value})});settingsMsg.textContent=' Saved';}
function renderRestaurants(a){restaurants.innerHTML=a.map(x=>`<div class="row"><b>${x.name}</b><span>${x.status}</span><button onclick="setRestaurant(${x.id},'approved')">Approve</button><button onclick="setRestaurant(${x.id},'suspended')">Suspend</button></div>`).join('')}
async function setRestaurant(id,status){await api('restaurants/'+id+'/',{method:'PATCH',body:JSON.stringify({status})});renderRestaurants(await api('restaurants/'));}
function renderDelivery(a){delivery.innerHTML=a.map(x=>`<div class="row"><b>Rider #${x.id}</b><span>${x.approved?'Approved':'Pending'}</span><button onclick="setRider(${x.id},true)">Approve</button><button onclick="setRider(${x.id},false)">Disable</button></div>`).join('')}
async function setRider(id,approved){await api('delivery/'+id+'/',{method:'PATCH',body:JSON.stringify({approved})});renderDelivery(await api('delivery/'));}
function renderOrders(a){orders.innerHTML=a.map(x=>`<div class="row"><b>#${x.id} ${x.restaurant}</b><span>${x.status}</span><span>Total ₹${x.total}</span><span>Commission ₹${x.commission}</span></div>`).join('')}
load();
</script></main></body></html>
