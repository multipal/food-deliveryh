<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Food • Home</title><link rel="stylesheet" href="../css/style.css"><script src="../js/store.js"></script></head><body>
<header><a class="brand" href="index.html"><span class="brand-logo" id="siteLogo">🍔</span><span id="siteName">Local Food</span></a><nav><a class="navlink" href="orders.html">📦 My Orders</a><a class="navlink" href="cart.html">🛒 Cart (<span data-cart-count>0</span>)</a></nav></header>
<main class="container"><section class="hero"><span class="pill">⚡ Fast local delivery</span><h2>Good food,<br>delivered to you.</h2><p>Search your favourite food, dish or restaurant and order in a few taps.</p><input id="q" class="search" placeholder="🔎  Search pizza, biryani, burger or restaurant..."></section>
<div class="ad-slot" id="adSlot"><div><strong>Advertisement</strong> <span id="adText">Sponsored placement</span></div></div>
<div class="section-title"><h2>What are you craving?</h2></div><div class="category-grid" id="cats"></div>
<div class="section-title"><h2>Offers for you</h2></div><div class="grid" id="offers"></div>
<div class="section-title"><h2>Popular restaurants</h2><span class="muted">Local favourites</span></div><div class="grid" id="list"></div></main>
<script>
const categories=[['🍕','Pizza'],['🍔','Burger'],['🍗','Biryani'],['🍜','Chinese'],['🥤','Drinks'],['🍰','Dessert']];
function render(q=''){const term=q.toLowerCase().trim();list.innerHTML='';let rs=restaurants.filter(r=>!term||r.name.toLowerCase().includes(term)||r.tags.toLowerCase().includes(term)||r.items.some(i=>i.name.toLowerCase().includes(term)||i.category.toLowerCase().includes(term)));if(!rs.length){list.innerHTML='<div class="card">No matching restaurant found. Try another food name.</div>';return}rs.forEach(r=>list.insertAdjacentHTML('beforeend',`<article class="card restaurant-card"><div class="food-cover">${r.items[0]?.veg?'🍕':'🍗'}</div><div class="body"><div class="row"><h3>${r.name}</h3><span class="rating">⭐ ${r.rating}</span></div><p class="muted">${r.tags}</p><div class="row"><span>🕐 ${r.time}</span><span>🏷️ ${r.offer}</span></div><a class="button full" href="restaurant.html?id=${r.id}">View menu</a></div></article>`))}
async function loadBranding(){try{const b=await fetch('../api/v1/admin/public/branding/').then(r=>r.json());siteName.textContent=b.site_name||'Local Food';if(b.site_logo_url)siteLogo.innerHTML=`<img src="${b.site_logo_url}" alt="logo" style="width:34px;height:34px;border-radius:9px;object-fit:cover">`;const ads=await fetch('../api/v1/admin/public/ads/?placement=home').then(r=>r.json());if(ads[0])adText.innerHTML=ads[0].target_url?`<a href="${ads[0].target_url}" target="_blank" rel="sponsored noopener">${ads[0].title}</a>`:(ads[0].title||'Sponsored placement')}catch(e){}}loadBranding();categories.forEach(([e,c])=>cats.insertAdjacentHTML('beforeend',`<button class="category" onclick="q.value='${c}';render('${c}')"><span class="emoji">${e}</span>${c}</button>`));
restaurants.forEach(r=>offers.insertAdjacentHTML('beforeend',`<a class="card offer" href="restaurant.html?id=${r.id}"><span class="pill">LIMITED OFFER</span><h3>${r.offer}</h3><p class="muted">${r.name} · ⭐ ${r.rating} · ${r.time}</p></a>`));
q.addEventListener('input',e=>render(e.target.value));render();
</script></body></html>
