<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart</title><link rel="stylesheet" href="../css/style.css"><script src="../js/store.js"></script></head>
<body><header><a href="index.html">← Food</a><h1>🛒 Cart</h1></header><div class="container"><div id="cart"></div><div class="card" id="summary"></div></div>
<script>
function draw(){const c=getCart();cart.innerHTML=c.length?c.map((x,n)=>`<div class="card row"><div><b>${x.item.name}</b><br><span>₹${x.item.price}</span></div><div class="qty"><button onclick="chg(${n},-1)">−</button> ${x.qty} <button onclick="chg(${n},1)">+</button></div></div>`).join(''):'<div class="card">Your cart is empty.<br><a class="button" href="index.html">Browse food</a></div>';summary.innerHTML=c.length?`<h3>Bill summary</h3><div class="row"><span>Subtotal</span><b>₹${cartSubtotal()}</b></div><div class="row"><span>Delivery</span><b>₹${deliveryFee()}</b></div><div class="row"><span>Coupon</span><b>-₹${couponDiscount()}</b></div><hr><div class="row"><b>Total</b><b>₹${cartTotal()}</b></div><div class="coupon"><input id="coupon" value="${getCoupon()}" placeholder="Coupon code"><button class="button" onclick="applyCoupon()">Apply</button></div><a class="button full" href="checkout.html">Continue to checkout</a>`:''}
function chg(n,d){let c=getCart();c[n].qty+=d;if(c[n].qty<=0)c.splice(n,1);saveCart(c);draw()}function applyCoupon(){const code=coupon.value.trim().toUpperCase();if(code&&!coupons[code])return alert('Invalid coupon');if(code&&cartSubtotal()<coupons[code].min)return alert('Minimum order for this coupon is ₹'+coupons[code].min);setCoupon(code);draw()}window.addEventListener('cartchange',draw);draw();
</script></body></html>
