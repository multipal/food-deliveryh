<!doctype html><html><head><meta charset="utf-8"><title>Delivery Dashboard</title><link rel="stylesheet" href="../dashboard.css"></head><body><header><b>Delivery Boy Dashboard</b></header><main><button onclick="toggle()">Online/Offline</button><h2>Assignments</h2><div id="assignments"></div></main><script src="../dashboard.js"></script><script>
async function load(){let r=await api('/api/v1/delivery/assignments/');let d=await r.json();assignments.innerHTML=d.map(a=>`<article><b>Order #${a.order}</b><p>${a.status}</p>${a.status==='OFFERED'?`<button onclick="accept(${a.id})">Accept</button>`:''}</article>`).join('')} async function accept(id){await api('/api/v1/delivery/assignments/'+id+'/accept/',{method:'POST'});load()} async function toggle(){let r=await api('/api/v1/delivery/me/');let p=await r.json();await api('/api/v1/delivery/me/',{method:'PATCH',body:JSON.stringify({online:!p.online})});load()} load();
</script></body></html>
