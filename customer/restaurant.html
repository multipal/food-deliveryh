<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu</title><link rel="stylesheet" href="../css/style.css"><script src="../js/store.js"></script></head>
<body><header><a href="index.html">← Food</a><h1 id="title"></h1><a href="cart.html">🛒 (<span data-cart-count>0</span>)</a></header><div class="container"><div class="card"><div id="meta"></div><p class="muted" id="offer"></p></div><h2>Menu</h2><div id="menu" class="grid"></div></div>
<script>const r=findRestaurant(new URLSearchParams(location.search).get('id'));title.textContent=r.name;meta.textContent=`⭐ ${r.rating} · ${r.time} · ${r.tags}`;offer.textContent=`Today's offer: ${r.offer}`;r.items.forEach(i=>menu.insertAdjacentHTML('beforeend',`<article class="card"><div class="row"><div><h3>${i.name}</h3><p class="price">₹${i.price}</p><small>${i.veg?'🟢 Veg':'🔴 Non-veg'}</small></div><button class="button" onclick='addItem(${r.id},${JSON.stringify(i)})'>Add</button></div></article>`));</script></body></html>
